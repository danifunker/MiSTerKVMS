[package]
name = "kvms-core"
description = "Platform-independent core for MiSTerKVMS: mrext input, sessions, video and audio from capture server streams and local capture cards."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kvms_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = "0.32"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
wgpu = "30"
raw-window-handle = "0.6"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mkvm = { path = "../mkvm" }
kvms-codec = { path = "../codec" }
kvms-capture = { path = "../capture" }
mdns-sd = "0.13"
png = "0.18"
# Screenshots: the core and time under the picture.
font8x8 = { version = "0.3", default-features = false }
# The Windows app gets host previews' JPEGs through the C API's JSON.
base64 = "0.23"
if-addrs = "0.13"

[target.'cfg(target_os = "android")'.dependencies]
# The JNI functions in android.rs; both already come with cpal on Android.
jni-sys = "0.4"
ndk-context = "0.1"
# wgpu's and cpal's warnings, to logcat.
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
